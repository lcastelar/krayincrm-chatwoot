version: '3.8'

services:
  krayin_app:
    image: ghcr.io/lcastelar/krayincrm-chatwoot:latest
    environment:
      APP_NAME: "Krayin CRM"
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: https://crm.example.com
      
      # Banco de dados
      DB_CONNECTION: mysql
      DB_HOST: krayin_db
      DB_PORT: 3306
      DB_DATABASE: krayincrm
      DB_USERNAME: root
      DB_PASSWORD: YOUR_DB_PASSWORD
      
      # Redis / Cache / Sessão
      REDIS_HOST: krayin_redis
      REDIS_PORT: 6379
      CACHE_STORE: redis
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: redis

      # Configurações do Chatwoot Dashboard App & Webhook
      CHATWOOT_URL: https://chat.example.com
      CHATWOOT_API_TOKEN: YOUR_CHATWOOT_TOKEN
      CHATWOOT_ACCOUNT_ID: 1
    deploy:
      replicas: 1
      restart_policy:
        condition: any
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.krayin.rule=Host(`crm.example.com`)"
        - "traefik.http.routers.krayin.entrypoints=websecure"
        - "traefik.http.routers.krayin.tls.certresolver=letsencrypt"
        - "traefik.http.services.krayin.loadbalancer.server.port=80"
    networks:
      - traefik_public
      - internal

  krayin_db:
    image: percona/percona-server:8.0
    command: --default-authentication-plugin=mysql_native_password --sql-mode=""
    environment:
      MYSQL_ROOT_PASSWORD: YOUR_DB_PASSWORD
      MYSQL_DATABASE: krayincrm
    volumes:
      - krayin_db_data:/var/lib/mysql
    deploy:
      replicas: 1
      restart_policy:
        condition: any
    networks:
      - internal

  krayin_redis:
    image: redis:alpine
    deploy:
      replicas: 1
      restart_policy:
        condition: any
    networks:
      - internal

volumes:
  krayin_db_data:

networks:
  traefik_public:
    external: true
  internal:
    driver: overlay
